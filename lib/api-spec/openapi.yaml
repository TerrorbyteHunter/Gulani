openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gulani marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product discovery
  - name: cart
    description: Shopping cart
  - name: checkout
    description: Checkout and payment initiation
  - name: orders
    description: Customer orders
  - name: vendors
    description: Vendor applications and portal
  - name: chat
    description: Conversations and messaging
  - name: support
    description: Customer and vendor support tickets
  - name: admin
    description: Marketplace operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /catalog/summary:
    get:
      operationId: getCatalogSummary
      tags: [catalog]
      summary: Get storefront summary
      responses:
        "200":
          description: Storefront summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSummary"
  /catalog/categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List product categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
  /catalog/products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: Search and filter products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, newest, price_asc, price_desc, top_rated]
            default: relevance
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
      responses:
        "200":
          description: Product results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /catalog/products/{productId}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get product details
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current shopping cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product variant to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "201":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /cart/items/{itemId}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart quantity
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdate"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeCartItem
      tags: [cart]
      summary: Remove a cart item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
  /delivery-options:
    get:
      operationId: getDeliveryOptions
      tags: [checkout]
      summary: Get delivery choices and estimates for a destination
      parameters:
        - in: query
          name: deliveryZone
          required: true
          schema:
            type: string
            enum: [lusaka, copperbelt, other_zambia]
        - in: query
          name: fulfillment
          required: false
          schema:
            type: string
            enum: [local, sourced]
      responses:
        "200":
          description: Delivery estimates for the selected destination
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryOption"
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Place a paid order
      description: Initiates a mobile-money or Visa payment. Cash on delivery is not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List customer orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations:
    get:
      operationId: listConversations
      tags: [chat]
      summary: List conversations visible to the current user
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [buyer_vendor, customer_support, vendor_support]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, closed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatConversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createConversation
      tags: [chat]
      summary: Start a buyer/vendor or support conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversation"
      responses:
        "201":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [chat]
      summary: Get a visible conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [chat]
      summary: List conversation messages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Paginated messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: sendConversationMessage
      tags: [chat]
      summary: Send an idempotent conversation message
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessage"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [chat]
      summary: Mark a conversation read through a message
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkConversationRead"
      responses:
        "204":
          description: Read state updated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /support/tickets:
    get:
      operationId: listChatTickets
      tags: [support]
      summary: List support tickets visible to the current user
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, open, pending, on_hold, resolved, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, normal, high, urgent]
        - name: requesterType
          in: query
          schema:
            type: string
            enum: [customer, vendor]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Support tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createChatTicket
      tags: [support]
      summary: Create a support ticket and conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatTicket"
      responses:
        "201":
          description: Support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /support/tickets/{ticketId}:
    get:
      operationId: getChatTicket
      tags: [support]
      summary: Get a support ticket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateChatTicket
      tags: [support]
      summary: Update support ticket workflow fields
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatTicket"
      responses:
        "200":
          description: Updated support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /support/tickets/{ticketId}/messages:
    post:
      operationId: sendChatTicketMessage
      tags: [support]
      summary: Send a message to a support ticket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessage"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /vendors/applications:
    post:
      operationId: submitVendorApplication
      tags: [vendors]
      summary: Submit a vendor application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorApplicationInput"
      responses:
        "201":
          description: Application received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorApplication"
  /vendor/dashboard:
    get:
      operationId: getVendorDashboard
      tags: [vendors]
      summary: Get vendor portal summary
      responses:
        "200":
          description: Vendor dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorDashboard"
  /vendor/products:
    get:
      operationId: listVendorProducts
      tags: [vendors]
      summary: List products owned by the current vendor
      responses:
        "200":
          description: Vendor products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorProduct"
    post:
      operationId: createVendorProduct
      tags: [vendors]
      summary: Create a vendor product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
  /vendor/products/{productId}:
    patch:
      operationId: updateVendorProduct
      tags: [vendors]
      summary: Update a vendor product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorProductInput"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: archiveVendorProduct
      tags: [vendors]
      summary: Archive a vendor product
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Archived product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorProduct"
        "404":
          $ref: "#/components/responses/NotFound"
  /vendor/products/bulk:
    post:
      operationId: bulkUpdateVendorProducts
      tags: [vendors]
      summary: Apply a bulk product action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorProductBulkUpdate"
      responses:
        "200":
          description: Updated products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorProduct"
  /vendor/orders:
    get:
      operationId: listVendorOrders
      tags: [vendors]
      summary: List orders for the current vendor
      responses:
        "200":
          description: Vendor orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorOrder"
  /vendor/orders/{orderId}/status:
    patch:
      operationId: updateVendorOrderStatus
      tags: [vendors]
      summary: Update a vendor order status
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorOrderStatusUpdate"
      responses:
        "200":
          description: Updated vendor order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorOrder"
        "404":
          $ref: "#/components/responses/NotFound"
  /vendor/reviews:
    get:
      operationId: listVendorReviews
      tags: [vendors]
      summary: List reviews for the current vendor
      responses:
        "200":
          description: Vendor reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorReview"
  /vendor/reviews/{reviewId}/reply:
    patch:
      operationId: replyToVendorReview
      tags: [vendors]
      summary: Reply to a customer review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorReviewReply"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorReview"
  /vendor/promotions:
    get:
      operationId: listVendorPromotions
      tags: [vendors]
      summary: List vendor promotions
      responses:
        "200":
          description: Vendor promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorPromotion"
    post:
      operationId: createVendorPromotion
      tags: [vendors]
      summary: Create a vendor promotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorPromotionInput"
      responses:
        "201":
          description: Created promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPromotion"
  /vendor/promotions/{promotionId}:
    patch:
      operationId: updateVendorPromotion
      tags: [vendors]
      summary: Update a vendor promotion
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorPromotionUpdate"
      responses:
        "200":
          description: Updated promotion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorPromotion"
  /vendor/analytics:
    get:
      operationId: getVendorAnalytics
      tags: [vendors]
      summary: Get vendor analytics
      responses:
        "200":
          description: Vendor analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorAnalytics"
  /vendor/storefront:
    get:
      operationId: getVendorStorefront
      tags: [vendors]
      summary: Get vendor storefront settings
      responses:
        "200":
          description: Vendor storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorStorefront"
    patch:
      operationId: updateVendorStorefront
      tags: [vendors]
      summary: Update vendor storefront settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorStorefrontUpdate"
      responses:
        "200":
          description: Updated storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorStorefront"
  /stores/{vendorId}:
    get:
      operationId: getPublicVendorStorefront
      tags: [vendors]
      summary: Get a public vendor storefront
      parameters:
        - name: vendorId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public vendor storefront
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicVendorStorefront"
        "404":
          $ref: "#/components/responses/NotFound"
  /vendor/verification:
    get:
      operationId: getVendorVerification
      tags: [vendors]
      summary: Get vendor verification status
      responses:
        "200":
          description: Vendor verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorVerification"
    patch:
      operationId: updateVendorVerification
      tags: [vendors]
      summary: Submit vendor verification information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorVerificationUpdate"
      responses:
        "200":
          description: Updated verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorVerification"
  /vendor/settings:
    get:
      operationId: getVendorSettings
      tags: [vendors]
      summary: Get vendor settings
      responses:
        "200":
          description: Vendor settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSettings"
    patch:
      operationId: updateVendorSettings
      tags: [vendors]
      summary: Update vendor settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSettingsUpdate"
      responses:
        "200":
          description: Updated vendor settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSettings"
  /vendor/support-tickets:
    get:
      operationId: listVendorSupportTickets
      tags: [vendors]
      summary: List vendor support tickets
      responses:
        "200":
          description: Vendor support tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorSupportTicket"
    post:
      operationId: createVendorSupportTicket
      tags: [vendors]
      summary: Create a vendor support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorSupportTicketInput"
      responses:
        "201":
          description: Created support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorSupportTicket"
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get operations dashboard summary
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List all marketplace orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Operations order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
  /admin/orders/{orderId}/status:
    patch:
      operationId: updateAdminOrderStatus
      tags: [admin]
      summary: Update an order's fulfillment status
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "404":
          $ref: "#/components/responses/NotFound"
  /admin/vendor-applications:
    get:
      operationId: listAdminVendorApplications
      tags: [admin]
      summary: List vendor applications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
