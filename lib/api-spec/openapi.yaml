components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ChatParticipant:
      type: object
      properties:
        userId: { type: string }
        roleInChat: { type: string, enum: [customer, vendor, support, master_admin, system_admin] }
        lastReadMessageId: { type: ["string", "null"] }
        muted: { type: boolean }
      required: [userId, roleInChat, lastReadMessageId, muted]
    ChatConversation:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [buyer_vendor, customer_support, vendor_support] }
        buyerId: { type: ["string", "null"] }
        vendorId: { type: ["string", "null"] }
        contextType: { type: string, enum: [product, order, shop, general] }
        contextId: { type: ["string", "null"] }
        status: { type: string, enum: [active, archived, closed] }
        lastMessageAt: { type: ["string", "null"] }
        lastMessagePreview: { type: ["string", "null"] }
        unreadCount: { type: integer }
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ChatParticipant"
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, type, buyerId, vendorId, contextType, contextId, status, lastMessageAt, lastMessagePreview, unreadCount, participants, createdAt, updatedAt]
    CreateConversation:
      type: object
      properties:
        type: { type: string, enum: [buyer_vendor, customer_support, vendor_support] }
        vendorId: { type: string }
        recipientId: { type: string, minLength: 1 }
        initialMessage: { type: string, minLength: 1, maxLength: 4000 }
        contextType: { type: string, enum: [product, order, shop, general] }
        contextId: { type: string }
      required: [type, contextType]
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        conversationId: { type: string }
        senderId: { type: ["string", "null"] }
        senderRole: { type: string, enum: [customer, vendor, support, master_admin, system_admin, system] }
        type: { type: string, enum: [text, image, file, product_card, order_card, system, internal_note] }
        body: { type: ["string", "null"] }
        metadata: { type: ["object", "null"], additionalProperties: true }
        replyToMessageId: { type: ["string", "null"] }
        clientMessageId: { type: ["string", "null"] }
        deliveryStatus: { type: string, enum: [sent, delivered, read] }
        createdAt: { type: string }
        editedAt: { type: ["string", "null"] }
        deletedAt: { type: ["string", "null"] }
      required: [id, conversationId, senderId, senderRole, type, body, metadata, replyToMessageId, clientMessageId, deliveryStatus, createdAt, editedAt, deletedAt]
    ChatMessagePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        nextCursor: { type: ["string", "null"] }
        hasMore: { type: boolean }
      required: [items, nextCursor, hasMore]
    SendChatMessage:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
        type: { type: string, enum: [text, image, file, product_card, order_card, internal_note] }
        metadata: { type: object, additionalProperties: true }
        replyToMessageId: { type: string }
        clientMessageId: { type: string, minLength: 1, maxLength: 128 }
      required: [body, clientMessageId]
    MarkConversationRead:
      type: object
      properties:
        messageId: { type: string }
      required: [messageId]
    ChatTicket:
      type: object
      properties:
        id: { type: string }
        ticketNumber: { type: string }
        conversationId: { type: string }
        requesterId: { type: string }
        requesterType: { type: string, enum: [customer, vendor] }
        category: { type: string }
        subject: { type: string }
        priority: { type: string, enum: [low, normal, high, urgent] }
        status: { type: string, enum: [new, open, pending, on_hold, resolved, closed] }
        assignedAgentId: { type: ["string", "null"] }
        relatedOrderId: { type: ["string", "null"] }
        relatedProductId: { type: ["string", "null"] }
        relatedVendorId: { type: ["string", "null"] }
        sourceConversationId: { type: ["string", "null"] }
        resolutionCode: { type: ["string", "null"] }
        resolutionNote: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, ticketNumber, conversationId, requesterId, requesterType, category, subject, priority, status, assignedAgentId, relatedOrderId, relatedProductId, relatedVendorId, sourceConversationId, resolutionCode, resolutionNote, createdAt, updatedAt]
    CreateChatTicket:
      type: object
      properties:
        category: { type: string, minLength: 2, maxLength: 80 }
        subject: { type: string, minLength: 3, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 5000 }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        relatedOrderId: { type: string }
        relatedProductId: { type: string }
        relatedVendorId: { type: string }
        clientMessageId: { type: string, minLength: 1, maxLength: 128 }
      required: [category, subject, message, clientMessageId]
    UpdateChatTicket:
      type: object
      properties:
        status: { type: string, enum: [new, open, pending, on_hold, resolved, closed] }
        priority: { type: string, enum: [low, normal, high, urgent] }
        assignedAgentId: { type: ["string", "null"] }
        category: { type: string, minLength: 2, maxLength: 80 }
        resolutionCode: { type: string, minLength: 2, maxLength: 80 }
        resolutionNote: { type: string, minLength: 2, maxLength: 2000 }
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        productCount: { type: integer }
        imageUrl: { type: string }
      required: [id, name, slug, productCount, imageUrl]
    ProductVariant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        basePrice: { type: number }
        markupRate: { type: number }
        sku: { type: string }
        stockQty: { type: integer }
      required: [id, name, price, sku, stockQty]
    Product:
      type: object
      properties:
        id: { type: string }
        vendorId: { type: string }
        title: { type: string }
        slug: { type: string }
        description: { type: string }
        category: { type: string }
        vendorName: { type: string }
        vendorRating: { type: number }
        price: { type: number }
        compareAtPrice: { type: ["number", "null"] }
        currency: { type: string }
        imageUrl: { type: string }
        badge: { type: ["string", "null"] }
        fulfillment: { type: string, enum: [local, sourced] }
        source: { type: string }
        sourceProductId: { type: ["string", "null"] }
        basePrice: { type: number }
        markupRate: { type: number }
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
      required: [id, vendorId, title, slug, description, category, vendorName, vendorRating, price, currency, imageUrl, fulfillment, variants]
    CatalogSummary:
      type: object
      properties:
        featured:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        trending:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        marketplaceMessage: { type: string }
      required: [featured, trending, categories, marketplaceMessage]
    CartItem:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        vendorId: { type: string }
        title: { type: string }
        vendorName: { type: string }
        imageUrl: { type: string }
        variantName: { type: string }
        unitPrice: { type: number }
        quantity: { type: integer }
        fulfillment: { type: string, enum: [local, sourced] }
      required: [id, productId, vendorId, title, vendorName, imageUrl, variantName, unitPrice, quantity, fulfillment]
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal: { type: number }
        deliveryFee: { type: number }
        total: { type: number }
        currency: { type: string }
      required: [items, subtotal, deliveryFee, total, currency]
    CartItemInput:
      type: object
      properties:
        productId: { type: string }
        variantId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20 }
      required: [productId, variantId, quantity]
    CartItemUpdate:
      type: object
      properties:
        quantity: { type: integer, minimum: 1, maximum: 20 }
      required: [quantity]
    DeliveryOption:
      type: object
      properties:
        id: { type: string, enum: [shop_pickup, shop_delivery, yango_delivery, platinum_couriers] }
        name: { type: string }
        description: { type: string }
        fee: { type: number }
        estimatedDelivery: { type: string }
      required: [id, name, description, fee, estimatedDelivery]
    CheckoutInput:
      type: object
      properties:
        email: { type: string, format: email }
        phone: { type: string, minLength: 7 }
        fullName: { type: string, minLength: 2 }
        address: { type: string, minLength: 5 }
        deliveryZone: { type: string, minLength: 2 }
        deliveryMethod: { type: string, enum: [shop_pickup, shop_delivery, yango_delivery, platinum_couriers] }
        paymentMethod: { type: string, enum: [mtn_mobile_money, airtel_money, visa] }
        paymentPhone: { type: ["string", "null"] }
      required: [email, phone, fullName, address, deliveryZone, deliveryMethod, paymentMethod]
    CheckoutResult:
      type: object
      properties:
        orderId: { type: string }
        orderNumber: { type: string }
        paymentStatus: { type: string, enum: [pending, confirmed, failed] }
        nextAction: { type: ["string", "null"] }
