        cancelledRefundedOrders: { type: integer }
        productsInStock: { type: integer }
        lowStockAlerts: { type: integer }
        unreadCustomerMessages: { type: integer }
        pendingDisputes: { type: integer }
        availableBalance: { type: number }
        pendingBalance: { type: number }
        recentOrders:
