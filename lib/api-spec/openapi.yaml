        orderNumber: { type: string }
        status: { type: string }
        createdAt: { type: string }
        total: { type: number }
        currency: { type: string }
        deliveryAddress: { type: string }
        deliveryFee: { type: number }
        deliveryMethod: { type: string }
        items:
          type: array
          items:
