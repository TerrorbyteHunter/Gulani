        verification:
          $ref: "#/components/schemas/VendorVerification"
        settings:
          $ref: "#/components/schemas/VendorSettings"
      required: [vendorName, pendingOrders, productsLive, revenueThisMonth, rating, totalSales, todaySales, ordersAwaitingShipment, completedOrders, cancelledRefundedOrders, productsInStock, lowStockAlerts, unreadCustomerMessages, pendingDisputes, availableBalance, pendingBalance, recentOrders, salesChart, customers, inventory, storefront, verification, settings]
    VendorSalesPoint:
      type: object
      properties:
        label: { type: string }
        sales: { type: number }
        orders: { type: integer }
      required: [label, sales, orders]
    VendorOrder:
